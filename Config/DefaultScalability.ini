; ProjectBopis quality tiers (2026-10-27). High (level 2): the Steam Deck at 800p 60 and the
; GTX 1650 at 1080p 60. Low (level 0): the GTX 1050 Ti and 750 Ti. Only values that differ
; from the engine's BaseScalability.ini are listed.

[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.MaxCSMResolution=1024

[ShadowQuality@2]
r.ShadowQuality=3
r.Shadow.CSM.MaxCascades=2
r.Shadow.DistanceScale=1.0
r.VolumetricFog=0

[ViewDistanceQuality@2]
; 2026-11-01, CC review: characters skip LOD0 (body 7.3k -> 5.4k verts). Safe for clothing since
; the bodies have 3 LODs. Check the player's close-up silhouette on the Deck.
r.SkeletalMeshLODBias=1

[EffectsQuality@0]
r.SubsurfaceScattering=0
r.SeparateTranslucencyScreenPercentage=50
r.SeparateTranslucencyUpsampleMode=1

[EffectsQuality@2]
; 2026-11-01, Deck traces 8-9: skin subsurface scattering 0.4 ms every frame (up to 6.6 in
; close-ups). Half-resolution translucency is Deck-only (2026-11-02): set by code in
; UBopisGameInstance::ApplyDeckOverrides, not here, so PCs on High keep full-resolution particles.
r.SubsurfaceScattering=0
; 2026-11-01, Deck Medium trace: the engine's Medium lighting volume (32, no blur) costs 0.14 ms
; against High's 1.15 (48 + blur). Lit particles stay lit, from a coarser grid.
r.TranslucencyLightingVolume.Dim=32
r.TranslucencyLightingVolume.Blur=0
; 2026-11-02: the impact effects are unlit now, so only CC's eyelashes and eye water still read
; the volume (~0.15 ms). Off; the lashes lose volume lighting (user: "do all of them").
r.TranslucencyLightingVolume=0

[PostProcessQuality@0]
r.Tonemapper.Quality=3

[PostProcessQuality@2]
r.AmbientOcclusionLevels=1
; 2026-11-01, Deck sixth trace: post 1.9 ms and SSAO 1.3 ms. The bake carries most of the
; occlusion now, and bloom's top two passes are barely visible at 800p.
r.AmbientOcclusionMaxQuality=50
r.BloomQuality=3

[TextureQuality@0]
r.Streaming.MipBias=1
r.Streaming.Boost=1
r.Streaming.PoolSize=1000
r.MaxAnisotropy=2

[TextureQuality@2]
r.Streaming.PoolSize=2000
